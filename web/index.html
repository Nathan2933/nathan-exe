    <style id="nx-loader-css">
html.nx-loading{overflow:hidden}
#nx-loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,20px);padding:12px;background:radial-gradient(ellipse at 50% 38%,#1b3270 0,#101F45 60%,#0a1530 100%);color:#fff1d6;font-family:'Silkscreen','Courier New',monospace;text-align:center;transition:opacity .35s ease,visibility .35s;overflow:hidden}
#nx-loader.nx-out{opacity:0;visibility:hidden;pointer-events:none}
#nx-loader .nx-col{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vh,20px)}
#nx-loader .nx-stage{position:relative;width:min(40vmin,170px);height:min(40vmin,170px);perspective:600px;flex:none}
#nx-loader .nx-ring{position:absolute;left:4%;bottom:6%;width:92%;height:28%;border:3px solid #ff6a3d;border-radius:50%;box-shadow:0 0 14px rgba(255,106,61,.6),inset 0 0 10px rgba(255,106,61,.35);animation:nx-pulse 1.8s ease-in-out infinite}
#nx-loader .nx-ped{position:absolute;left:22%;bottom:4%;width:56%;height:16%;background:#2f8f8a;border:3px solid #0a1530;border-radius:50%;box-shadow:0 5px 0 #1d5f5c,0 5px 0 3px #0a1530}
#nx-loader .nx-spin{position:absolute;left:19%;bottom:12%;width:62%;aspect-ratio:1;transform-style:preserve-3d;animation:nx-spin 6s linear infinite}
#nx-loader .nx-face{position:absolute;inset:0;background-size:100% 100%;image-rendering:pixelated;backface-visibility:hidden}
#nx-loader .nx-f{transform:translateZ(7px)}
#nx-loader .nx-b{transform:rotateY(180deg) translateZ(7px)}
#nx-loader .nx-t{margin:0;font-size:clamp(13px,3.6vw,20px);letter-spacing:.08em;color:#fff1d6;text-shadow:2px 2px 0 #0a1530}
#nx-loader .nx-t b{color:#f2a93b;font-weight:400}
#nx-loader .nx-bar{display:flex;gap:3px;padding:4px;border:3px solid #0a1530;background:#0a1530;box-shadow:0 0 0 2px #2f8f8a;width:min(76vw,260px)}
#nx-loader .nx-bar i{flex:1;height:12px;background:#22346b;transition:background .15s}
#nx-loader .nx-bar i.on{background:#f2a93b}
#nx-loader .nx-err{display:none;flex-direction:column;align-items:center;gap:10px;font-size:13px;color:#ffb199;max-width:min(86vw,360px)}
#nx-loader.nx-fail .nx-err{display:flex}
#nx-loader.nx-fail .nx-bar,#nx-loader.nx-fail .nx-t{display:none}
#nx-loader .nx-err button{font:inherit;font-size:14px;padding:8px 18px;background:#f2a93b;color:#0a1530;border:3px solid #0a1530;box-shadow:3px 3px 0 #2f8f8a;cursor:pointer;text-transform:uppercase}
@keyframes nx-spin{to{transform:rotateY(360deg)}}
@keyframes nx-pulse{50%{transform:scale(1.08);opacity:.7}}
@media (max-height:420px){#nx-loader{flex-direction:row;gap:22px}#nx-loader .nx-stage{width:min(48vh,130px);height:min(48vh,130px)}}
@media (prefers-reduced-motion:reduce){#nx-loader .nx-spin,#nx-loader .nx-ring{animation:none}#nx-loader{transition:none}}
</style>

<script>
document.documentElement.classList.add('nx-loading');
window.nxLoader=(function(){
  var done=false,steps={dom:0,fonts:0,page:0,load:0},N=12,wd;
  function el(){return document.getElementById('nx-loader')}
  function paint(){
    var e=el();if(!e)return;var n=0,k;for(k in steps)n+=steps[k];
    var on=Math.round(n/4*N),b=e.querySelector('.nx-bar').children;
    for(var i=0;i<b.length;i++)b[i].className=i<on?'on':'';
  }
  function step(k){steps[k]=1;paint();if(steps.page&&steps.load&&steps.fonts)finish()}
  function finish(){
    if(done)return;done=true;clearTimeout(wd);var e=el();if(!e)return;
    for(var k in steps)steps[k]=1;paint();
    e.classList.add('nx-out');document.documentElement.classList.remove('nx-loading');
    setTimeout(function(){e.parentNode&&e.parentNode.removeChild(e)},450);
  }
  function fail(msg){
    if(done)return;done=true;clearTimeout(wd);var e=el();if(!e)return;
    e.classList.add('nx-fail');e.querySelector('.nx-msg').textContent=msg||'Could not load NATHAN.EXE. Check your connection and try again.';
  }
  window.addEventListener('error',function(ev){var t=ev.target;if(t&&t.tagName=='SCRIPT'&&t.type=='module')fail()},true);
  wd=setTimeout(function(){fail('Loading is taking too long. Check your connection and try again.')},30000);
  document.addEventListener('DOMContentLoaded',function(){step('dom')});
  window.addEventListener('load',function(){step('load')});
  (document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,4000)})]):Promise.resolve()).then(function(){step('fonts')});
  return{page:function(){step('page')},fail:fail,retry:function(){location.reload()}};
})();
</script>
