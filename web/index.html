<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#101F45" />
    <meta name="description" content="Nathan Jerald · IT undergraduate and full-stack & cloud-native developer. Projects, skills, experience, achievements, resume and contact." />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="uploads/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="uploads/og-image.png" />
    <meta property="og:title" content="Nathan: Portfolio" />
    <meta property="og:description" content="Projects, skills, experience, resume and contact." />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/portfolio.css" />
  </head>
  <body class="portfolio">
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-head">
      <a class="logo-small" href="#top" aria-label="NATHAN.EXE, back to top"><img class="logo-icon" src="/assets/logos/nat_log.png" alt="" aria-hidden="true" width="40" height="40" />NATHAN<b>.EXE</b></a>
      <nav class="top-nav" aria-label="Sections">
        <a href="#about">About</a><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#experience">Experience</a><a href="#contact">Contact</a>
      </nav>
      <a class="btn primary play" href="./play.html"><span aria-hidden="true">▶</span> Play Game</a>
    </header>

    <div class="shell" id="top">
      <aside class="side" aria-label="Player card">
        <div class="side-card">
          <div class="side-id">
            <img class="portrait" id="portrait" alt="Pixel portrait of Nathan" width="96" height="96" />
            <div class="side-meta">
              <p class="p-label">PLAYER 01</p>
              <p class="p-name" id="side-name">NATHAN JERALD</p>
            </div>
            <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="side-nav">Menu</button>
          </div>
          <nav class="side-nav" id="side-nav" aria-label="Archive">
            <a href="#about"><i aria-hidden="true"></i>Profile</a>
            <a href="#journey"><i aria-hidden="true"></i>Journey</a>
            <a href="#discipline"><i aria-hidden="true"></i>Discipline</a>
            <a href="#projects"><i aria-hidden="true"></i>Missions</a>
            <a href="#skills"><i aria-hidden="true"></i>Skills</a>
            <a href="#experience"><i aria-hidden="true"></i>Career</a>
            <a href="#contact"><i aria-hidden="true"></i>Contact</a>
          </nav>
          <div class="side-actions">
            <a class="btn primary" href="./play.html"><span aria-hidden="true">▶</span> Play Game</a>
            <a class="btn" id="side-resume" href="/resume.pdf" target="_blank" rel="noopener">Resume ↗</a>
          </div>
        </div>
      </aside>

      <main id="main" aria-busy="true">
        <div class="notice hidden" id="notice" role="status"></div>
        <p class="loading">Loading archive…</p>
      </main>
    </div>

    <footer class="site-foot">
      <span id="foot-name">NATHAN.EXE</span> · <a href="./play.html">Play the interactive version</a>
    </footer>

    <dialog class="mission-dialog" id="mission-dialog" aria-labelledby="md-title">
      <div class="window-bar"><span class="title" id="md-file">mission.log</span><button class="md-close" id="md-close" type="button" aria-label="Close details">✕</button></div>
      <div class="md-body" id="md-body"></div>
    </dialog>
    <script type="module" src="/src/portfolio.js"></script>
  </body>
</html>
