# Netlify: connect the repository, no settings needed (this file configures them).
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"

# The admin is local-only: never serve it from the live site
[[redirects]]
  from = "/admin*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/__admin/*"
  to = "/404.html"
  status = 404
  force = true
