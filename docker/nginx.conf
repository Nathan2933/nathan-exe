server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # basic hardening
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # the admin is local-only: never serve it from a deployed container
  location ~ ^/(admin|__admin) { return 404; }

  # hashed build assets can be cached forever
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # content changes without a rebuild of the JS: always revalidate
  location /data/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

  # /reviews without the trailing slash goes to the reviews page
  location = /reviews { return 301 /reviews/; }

  # review pages always revalidate (an unpublished review must stop being served); strict CSP, static pages only
  # (add_header in a location replaces the server-level ones, so the basics are repeated here)
  location /reviews/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    try_files $uri $uri.html $uri/ =404;
  }

  location / { try_files $uri $uri.html $uri/ =404; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
