server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # basic hardening
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # the admin is local-only: never serve it from a deployed container
  location ~ ^/(admin|__admin) { return 404; }

  # hashed build assets can be cached forever
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }

  # content changes without a rebuild of the JS: always revalidate
  location /data/ { add_header Cache-Control "no-cache"; try_files $uri =404; }

  location / { try_files $uri $uri.html $uri/ =404; }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
